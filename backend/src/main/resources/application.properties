spring.application.name=campus-market
spring.config.import=optional:file:./config/application-local.properties,optional:file:./backend/config/application-local.properties
spring.datasource.url=${MARKET_DB_URL:jdbc:mysql://localhost:3306/2024011490?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MARKET_DB_USERNAME:root}
spring.datasource.password=${MARKET_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath:mapper/*.xml
market.upload-dir=./uploads

mybatis-plus.configuration.call-setters-on-nulls=true
mybatis-plus.configuration.return-instance-for-empty-row=true
